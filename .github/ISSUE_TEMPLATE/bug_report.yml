name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For security problems, do not use this form; see SECURITY.md.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@volo-uti/volo-web-utils"
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The released version, or the commit if you build from source.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest code or steps that show the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node, pnpm, TypeScript and operating system versions.
